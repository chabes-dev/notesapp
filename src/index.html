<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes</title>
<meta name="theme-color" content="#F5F3EE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>%CSS%</style>
</head>
<body>
<div id="app">
  <nav id="folders" class="col">
    <div id="flist" tabindex="0"></div>
    <button id="newfolder">+ New folder</button>
    <div style="display:flex;gap:4px;padding:4px 0 0">
      <button id="backup" class="pill" style="flex:1;font-size:10.5px;padding:6px 8px" title="Download all notes as a file">Back up</button>
      <button id="restore" class="pill" style="flex:1;font-size:10.5px;padding:6px 8px" title="Load notes from a backup file">Restore</button>
    </div>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
  </nav>
  <aside id="list" class="col">
    <div class="lhead">
      <h1 id="vname">All Notes</h1>
      <button class="ibtn" id="compose" title="New note in this window (⌘N opens a floating one)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search all notes" autocomplete="off"></label>
    <div id="notes" tabindex="0"></div>
  </aside>
  <main id="panes"></main>
</div>
<div id="toast"></div>
<script>%JS%</script>
</body>
</html>
